version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: credit_risk_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Explainable Credit Risk API
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_PATH=/app/model/loan_model.pkl
    volumes:
      - ./model:/app/model:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: credit_risk_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: credit_risk_network
